services:
  - type: web
    name: talentsift-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health_check/
    autoDeploy: true
    envVars:
      - key: RENDER
        value: "true"
